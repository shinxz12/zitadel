name: SmartTech login image

# Builds the customized Login UI (apps/login/Dockerfile.smarttech) and pushes it to GHCR.
on:
  push:
    branches: ["smarttech/**"]
    paths:
      - "apps/login/**"
      - "packages/**"
      - "proto/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/smarttech-login-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: smarttech-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "version=v4.20.1-smarttech.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/login/Dockerfile.smarttech
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zitadel-login:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/zitadel-login:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
